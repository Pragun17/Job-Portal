{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow p-4">
                <h3 class="mb-4 fw-bold">Post a New Job</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" name="title" class="form-control" required placeholder="e.g. Senior Python Developer">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" required placeholder="e.g. Bangalore / Remote">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Job Type</label>
                            <select name="job_type" class="form-select" required>
                                <option value="Full-Time">Full-Time</option>
                                <option value="Part-Time">Part-Time</option>
                                <option value="Remote">Remote</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Salary Range</label>
                        <input type="text" name="salary" class="form-control" required placeholder="e.g. $80,000 - $100,000 / yr">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea name="description" class="form-control" rows="6" required placeholder="Enter role responsibilities, requirements, benefits..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Publish Job Posting</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
